<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Mapa</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        #map { height: 100vh; width: 100%; }
    </style>
</head>

<body>
<div id="map"></div>

<script>
    let map = L.map('map').setView([-38.0, -57.55], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'OSM'
    }).addTo(map);

    let markers = [];

    function mostrarUbicacion(lat, lng, nombre) {
        L.marker([lat, lng])
            .addTo(map)
            .bindPopup(nombre);
    }

    function limpiarRestaurantes() {
        markers.forEach(m => map.removeLayer(m));
        markers = [];
    }

function mostrarRestaurante(lat, lng, nombre, id) {

    let marker = L.marker([lat, lng]).addTo(map);

    marker._restauranteId = id;

    marker.bindPopup(`
        <b>${nombre}</b><br>
    `);

    markers.push(marker);
}



</script>
</body>
</html>
